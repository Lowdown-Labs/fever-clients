name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-spec:
    name: Validate OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate with pinned openapi-generator
        run: |
          docker run --rm -v "$PWD:/local" \
            openapitools/openapi-generator-cli:v7.25.0@sha256:2ab0a9680222de65dc9d3baf861aa02b99e1b80c211d8221ebf3ae8f8a102524 \
            validate -i /local/spec/openapi.json --recommend

  drift:
    name: clients/ in sync with spec/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Detect spec change in this change set
        id: spec
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if git diff --name-only "$base" HEAD -- 2>/dev/null | grep -q '^spec/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Regenerate all clients
        if: steps.spec.outputs.changed == 'false'
        run: |
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
          VERSION="${VERSION:-0.0.0-dev}" scripts/generate.sh
      - name: Fail on drift
        if: steps.spec.outputs.changed == 'false'
        run: |
          if ! git diff --exit-code -- clients/; then
            echo "::error::clients/ is stale or was hand-edited. Generated code is"
            echo "::error::never edited by hand - change the spec or generator config."
            exit 1
          fi
      - name: Spec-change PR - release.yml will regenerate on merge
        if: steps.spec.outputs.changed == 'true'
        run: echo "spec/ touched; skipping drift check (regeneration happens at release)."

  smoke:
    name: "smoke: ${{ matrix.lang }}"
    runs-on: ubuntu-latest
    needs: validate-spec
    strategy:
      fail-fast: false
      matrix:
        lang: [python, typescript, go, ruby, java, rust, php, csharp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: matrix.lang == 'python'
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.lang == 'typescript'
        with:
          node-version: "22"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: matrix.lang == 'go'
        with:
          go-version: "1.26"
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4
        if: matrix.lang == 'ruby'
        with:
          ruby-version: "3.4"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: matrix.lang == 'java'
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        if: matrix.lang == 'rust'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        if: matrix.lang == 'php'
        with:
          php-version: "8.4"
          tools: composer
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        if: matrix.lang == 'csharp'
        with:
          dotnet-version: "8.0.x"
      - name: Smoke build
        run: scripts/smoke.sh ${{ matrix.lang }}
