name: Release

on:
  push:
    branches: [main]
    paths:
      - "spec/openapi.json"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Cut release
    runs-on: ubuntu-latest
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        run: |
          base="$(jq -r .info.version spec/openapi.json)"
          v="$base"
          while git rev-parse -q --verify "refs/tags/v${v}" >/dev/null; do
            v="$(echo "$v" | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}')"
          done
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing v${v} (spec base ${base})"

      - name: Toolchains
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26"
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4
        with:
          ruby-version: "3.4"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4"
          tools: composer
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Regenerate all clients
        run: VERSION="${{ steps.ver.outputs.version }}" scripts/generate.sh

      - name: Smoke every client
        run: |
          for lang in python typescript go ruby java rust php csharp; do
            scripts/smoke.sh "$lang"
          done

      - name: Import GPG key
        if: env.GPG_PRIVATE_KEY != ''
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Commit regenerated clients
        run: |
          git config user.name "fever-clients-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients/
          if git diff --cached --quiet; then
            echo "clients unchanged after regeneration"
          else
            git commit -m "CHANGES [skip ci]"
          fi
          v="${{ steps.ver.outputs.version }}"
          if [ -n "${GPG_PRIVATE_KEY:-}" ]; then
            git tag -s "v${v}" -m "fever-clients v${v}"
          else
            git tag -a "v${v}" -m "fever-clients v${v}"
          fi
          git pull --rebase origin main
          git push origin main --tags

      - name: Build artifacts
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          cp clients/python/dist/* dist/
          (cd clients/typescript && npm pack --pack-destination "$OLDPWD/dist")
          cp clients/ruby/fever_client.gem "dist/fever_client-${v}.gem"
          find clients/java/target -maxdepth 1 -name '*.jar' -exec cp {} dist/ \;
          (cd clients/csharp && dotnet pack --configuration Release --output "$OLDPWD/dist")
          for lang in go rust php; do
            tar --exclude='target' -czf "dist/fever-clients-${lang}-${v}.tar.gz" -C clients "$lang"
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist/

      - name: SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: dist/*

      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: "v${{ steps.ver.outputs.version }}"
          name: "fever-clients v${{ steps.ver.outputs.version }}"
          body: |
            Autogenerated from spec/openapi.json (FEVER Retrieval v${{ steps.ver.outputs.version }}).

            Clients: python · typescript · go · ruby · java · rust · php · csharp
            Install directly from the attached artifacts until registry
            publication lands - see README.md ("Installing from releases").

            Verify: sha256sum -c checksums.txt, then
            gh attestation verify <file> --repo Lowdown-Labs/fever-clients.
            Provenance inputs: pinned generator image (see scripts/generate.sh)
            + SBOM (sbom.spdx.json).
          files: dist/*
