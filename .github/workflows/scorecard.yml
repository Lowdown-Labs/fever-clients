name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  gate:
    name: Detect visibility
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.vis.outputs.public }}
    steps:
      - id: vis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(gh repo view --json visibility --jq .visibility)"
          [ "$v" = "PUBLIC" ] && p=true || p=false
          echo "public=$p" >> "$GITHUB_OUTPUT"

  analysis:
    name: OpenSSF Scorecard
    needs: gate
    if: needs.gate.outputs.public == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca
        with:
          sarif_file: results.sarif
