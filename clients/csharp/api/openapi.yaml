openapi: 3.1.0
info:
  description: "The multimodal media database. Images, video, audio, office documents,\
    \ and LiDAR in one table: hybrid vector + full-text search, dedupe, seek-to-moment\
    \ video hits, whisper transcript spans, collection grouping, and asset-to-asset\
    \ attachments. Tenancy, scale, and isolation are automatic; the tenant is taken\
    \ from the API key."
  title: FEVER Retrieval
  version: 0.4.0
servers:
- url: /
tags:
- description: "Ingest one or many media items (images, video, audio, PDFs) - inline,\
    \ staged, or S3 source."
  name: ingest
- description: "Media parents: unified info, raw bytes, sampled video frames, whisper\
    \ transcript segments, supported formats."
  name: media
- description: Poll ingest / backfill progress.
  name: jobs
- description: "Search by text (hybrid + rerank) or image (cosine), with video seek\
    \ and transcript spans."
  name: search
- description: Find near-duplicate clusters for a customer.
  name: duplicates
- description: Dump a tenant's vectors and metadata to S3.
  name: export
- description: Read-only SQL over the whitelisted corpus tables.
  name: query
- description: "Admin-gated API key management for this appliance: mint, list, revoke."
  name: keys
- description: Key identity and scope resolution.
  name: auth
- description: "Admin-gated per-customer index maintenance: reassign, clear, wipe."
  name: customers
- description: Corpus composition for dashboards and the demo page.
  name: corpus
paths:
  /healthz:
    get:
      operationId: healthz_healthz_get
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Healthz
  /v1/corpus:
    get:
      operationId: corpus_stats
      parameters:
      - explode: true
        in: query
        name: customer_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusStats"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: "Corpus composition: per-kind counts and top autotags"
      tags:
      - corpus
  /v1/customers/reassign-bulk:
    post:
      description: "Associate already-ingested images to customers after the fact,\
        \ at millions-of-rows scale. Accepts a multipart file upload (.csv, .jsonl,\
        \ .parquet) or a JSON body {\"s3_uri\": \"s3://bucket/key\", \"format\"?:\
        \ \"csv|jsonl|parquet\"}. Each row maps a key (exact blob key) or filename\
        \ to a customer_id; key is preferred when both are present. Rows are loaded\
        \ with COPY and moved with one set-based UPDATE per table, so a million-row\
        \ file completes in seconds. Reports matched/updated/noop/unmatched/conflict\
        \ counts; filename fanout moves every match."
      operationId: reassign_customers_bulk
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BulkReassignUpload"
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - adminToken: []
      summary: Reassign customer_id in bulk from a JSONL / CSV / Parquet mapping
      tags:
      - customers
  /v1/duplicates:
    post:
      description: "Find near-duplicate clusters. Scoped to one customer, this reads\
        \ the edge set maintained at ingest (millisecond answers; edges exist down\
        \ to cosine 0.80). An admin key with no customer_id scans live across all\
        \ customers; passing customer_ids narrows that live scan to a handful of accounts.\
        \ Both admin shapes see cross-customer duplicates. No delete or keep recommendation\
        \ is made: the clusters are yours to act on."
      operationId: find_duplicates
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicatesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicatesResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Find near-duplicate media clusters for a customer
      tags:
      - duplicates
  /v1/duplicates/suggested-threshold:
    get:
      operationId: suggested_dedup_threshold
      parameters:
      - explode: true
        in: query
        name: customer_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Suggest a duplicate-detection threshold from this customer's edge cosine
        distribution
      tags:
      - duplicates
  /v1/export:
    post:
      operationId: export_tenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResult"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Export the tenant's vectors and metadata to S3
      tags:
      - export
  /v1/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: Successful Response
      summary: Health check
  /v1/import:
    post:
      operationId: import_tenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Import vectors and metadata from a previous FEVER export in S3
      tags:
      - export
  /v1/jobs/{job_id}:
    get:
      operationId: get_job
      parameters:
      - explode: false
        in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Get ingest job progress
      tags:
      - jobs
  /v1/jobs/{job_id}/cancel:
    post:
      operationId: cancel_job
      parameters:
      - explode: false
        in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Cancel a pending or running ingest job
      tags:
      - jobs
  /v1/keys:
    get:
      operationId: list_keys
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ApiKey"
                title: Response List Keys
                type: array
                default: null
          description: Successful Response
      security:
      - adminToken: []
      summary: List this appliance's API keys
      tags:
      - keys
    post:
      operationId: create_key
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyReveal"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - adminToken: []
      summary: Mint an API key for this appliance
      tags:
      - keys
  /v1/keys/{key_id}/revoke:
    post:
      operationId: revoke_key
      parameters:
      - explode: false
        in: path
        name: key_id
        required: true
        schema:
          title: Key Id
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - adminToken: []
      summary: Revoke an API key
      tags:
      - keys
  /v1/media:
    post:
      description: "Throw 1..N media items over the wall. Small inline batches are\
        \ embedded and indexed synchronously and return blob ids; large batches or\
        \ an s3:// source return a Job you poll at /v1/jobs/{id}. Tenant is taken\
        \ from the API key."
      operationId: ingest_media
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Ingest one or many media items
      tags:
      - ingest
  /v1/media/formats:
    get:
      operationId: list_media_formats
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFormats"
          description: Successful Response
      security:
      - bearerAuth: []
      summary: "Ingest capability: supported extensions per media family"
      tags:
      - media
  /v1/media/{blob_id}:
    get:
      description: |-
        Unified record for a blob_id. Scoped keys can only read their own
        customer's blobs; other customers' blobs are a 404 (never an existence
        leak). Admin keys may narrow with ?customer_id=.
      operationId: get_media_info
      parameters:
      - explode: false
        in: path
        name: blob_id
        required: true
        schema:
          title: Blob Id
          type: integer
        style: simple
      - explode: true
        in: query
        name: customer_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaInfo"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: "Everything known about a blob: annotations, EXIF summary, media kind,\
        \ derived artifact counts"
      tags:
      - media
  /v1/media/{blob_id}/associate:
    post:
      description: |-
        Fill the relational columns after ingest (the SOR-driven import flow):
        collection_id groups assets under a client-owned project; parent_ref ties a
        companion asset (LiDAR, transcript, alternate capture) to its parent. Values
        are COALESCE-updates - present fields win, omitted fields stay. Re-ingesting
        the same content with the fields set does the same thing through the upsert.
      operationId: associate_media
      parameters:
      - explode: false
        in: path
        name: blob_id
        required: true
        schema:
          title: Blob Id
          type: integer
        style: simple
      - explode: true
        in: query
        name: customer_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssociateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaInfo"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Set a blob's collection and/or parent association (e.g. attach a LiDAR
        scan to its source photo)
      tags:
      - media
  /v1/media/{blob_id}/bytes:
    get:
      description: |-
        Return the bytes for a blob_id (JPEG, normalized to max_dim; 0 = raw
        bytes). Scoped keys can only fetch their own customer's items; other
        customers' blobs are a 404 (never an existence leak).

        ?waveform=1 renders an audio blob's waveform as a PNG (ffmpeg showwavespic)
        so clients can show a real visual for audio hits without decoding the clip
        in the browser.
      operationId: get_media_bytes
      parameters:
      - explode: false
        in: path
        name: blob_id
        required: true
        schema:
          title: Blob Id
          type: integer
        style: simple
      - explode: true
        in: query
        name: max_dim
        required: false
        schema:
          default: 1280
          title: Max Dim
          type: integer
        style: form
      - explode: true
        in: query
        name: waveform
        required: false
        schema:
          default: 0
          title: Waveform
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
            image/jpeg: {}
            image/png: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Fetch an indexed media item's bytes (images normalized to JPEG)
      tags:
      - media
  /v1/media/{blob_id}/frames:
    get:
      operationId: list_media_frames
      parameters:
      - explode: false
        in: path
        name: blob_id
        required: true
        schema:
          title: Blob Id
          type: integer
        style: simple
      - explode: true
        in: query
        name: customer_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/MediaFrame"
                title: Response List Media Frames
                type: array
                default: null
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Sampled video frames for a parent blob
      tags:
      - media
  /v1/media/{blob_id}/transcript:
    get:
      operationId: list_media_transcript
      parameters:
      - explode: false
        in: path
        name: blob_id
        required: true
        schema:
          title: Blob Id
          type: integer
        style: simple
      - explode: true
        in: query
        name: customer_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/TranscriptSegment"
                title: Response List Media Transcript
                type: array
                default: null
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Whisper transcript segments for a parent blob (audio or video)
      tags:
      - media
  /v1/query:
    post:
      description: "A mini SQL console over the appliance's corpus tables: as_blobs,\
        \ annotations, dup_edges, video_frames, transcript_segments, embeddings, datasets,\
        \ dataset_items (internal jobs/job_items stay queryable for compatibility\
        \ but are bookkeeping, not data). Exactly one SELECT statement. Natural-language\
        \ semantic search: an `<=>` comparison between a vec_prefix/vec_full column\
        \ and fever_search('some text') is allowed in the statement ORDER BY (rank\
        \ by meaning) or in the SELECT target list (project the raw cosine distance;\
        \ similarity = 1.0 - distance), at most four distinct fever_search() texts\
        \ per statement. Raw vector columns (embeddings.vec_*, video_frames.vec_*)\
        \ are selectable with an admin key; scoped keys get a rejection instead. tsvector\
        \ (annotations.fts, transcript_segments.fts) columns are excluded for everyone.\
        \ Scoped api keys are automatically restricted to their own customer_id, which\
        \ is why they may only submit a narrow statement shape: plain tables and JOINs\
        \ of them, with a FROM clause, and no subqueries, CTEs or set operations at\
        \ any depth (those are rejected rather than risk a partial rewrite - use an\
        \ admin key for them). Admin keys parse unrestricted and see every customer's\
        \ rows in their own tenant."
      operationId: query
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Run a read-only SQL SELECT over the corpus tables
      tags:
      - query
  /v1/search:
    post:
      description: "text runs a meaning-based vector search fused with lexical full-text\
        \ (RRF), reranked and calibrated so min_score is a real match probability.\
        \ image runs cosine similarity. customer_id and EXIF fields narrow the results."
      operationId: search
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/SearchHit"
                title: Response Search
                type: array
                default: null
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Search by text or image
      tags:
      - search
  /v1/whoami:
    get:
      operationId: whoami
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - bearerAuth: []
      summary: Report the calling key's role and customer scope
      tags:
      - auth
components:
  schemas:
    ApiKey:
      example:
        created_at: created_at
        customer_id: customer_id
        id: 0
        name: name
        revoked: false
        role: scoped
      properties:
        created_at:
          nullable: true
          type: string
        customer_id:
          nullable: true
          type: string
        id:
          title: Id
          type: integer
        name:
          nullable: true
          type: string
        revoked:
          default: false
          title: Revoked
          type: boolean
        role:
          default: scoped
          title: Role
          type: string
      required:
      - id
      title: ApiKey
    AssociateRequest:
      example:
        collection_id: collection_id
        parent_ref: parent_ref
      properties:
        collection_id:
          description: Set/update the collection grouping for this blob.
          nullable: true
          type: string
        parent_ref:
          description: "Set/update the pointer to this blob's related parent asset\
            \ (its external_ref, key, or blob_id)."
          nullable: true
          type: string
      title: AssociateRequest
    BulkReassignUpload:
      properties:
        file:
          format: binary
          nullable: true
          type: string
      title: BulkReassignUpload
    CorpusStats:
      example:
        kinds:
          key: 0
        top_tags:
        - count: 6
          tag: tag
        - count: 6
          tag: tag
      properties:
        kinds:
          additionalProperties:
            type: integer
          title: Kinds
          type: object
        top_tags:
          items:
            $ref: "#/components/schemas/CorpusTag"
          title: Top Tags
          type: array
          default: null
      required:
      - kinds
      - top_tags
      title: CorpusStats
    CorpusTag:
      example:
        count: 6
        tag: tag
      properties:
        count:
          title: Count
          type: integer
        tag:
          title: Tag
          type: string
      required:
      - count
      - tag
      title: CorpusTag
    CreateKeyRequest:
      example:
        customer_id: customer_id
        name: name
        role: admin
      properties:
        customer_id:
          description: "For a scoped key, the single customer_id every request with\
            \ this key is forced to. Must be empty for an admin key."
          nullable: true
          type: string
        name:
          description: Optional label for this API key (e.g. which app or integration
            uses it).
          nullable: true
          type: string
        role:
          description: "'admin' keys search/ingest across all customers and may pass\
            \ any customer_id; 'scoped' keys are locked server-side to one customer_id.\
            \ If omitted it is inferred from customer_id (present means scoped, absent\
            \ means admin)."
          enum:
          - admin
          - scoped
          nullable: true
          type: string
      title: CreateKeyRequest
    DuplicateCluster:
      example:
        member_customers:
        - member_customers
        - member_customers
        members:
        - 6
        - 6
        size: 1
        tightness: 5.962133916683182
      properties:
        member_customers:
          description: "customer_id of each member, parallel to members; a cluster\
            \ whose distinct customer count exceeds 1 is duplicated across accounts."
          items:
            nullable: true
            type: string
          title: Member Customers
          type: array
          default: null
        members:
          description: blob_ids of the items in this cluster.
          items:
            type: integer
          title: Members
          type: array
          default: null
        size:
          description: Number of items in this near-duplicate cluster.
          title: Size
          type: integer
        tightness:
          description: Minimum pairwise cosine similarity across the cluster.
          title: Tightness
          type: number
      required:
      - members
      - size
      - tightness
      title: DuplicateCluster
    DuplicatesRequest:
      example:
        customer_id: customer_id
        customer_ids:
        - customer_ids
        - customer_ids
        limit: 401
        threshold: 0.6027456183070403
      properties:
        customer_id:
          description: Restrict the scan to media tagged with this customer_id. A
            scoped key is always forced to its own customer_id; an admin key may pass
            any customer_id or none (all customers).
          nullable: true
          type: string
        customer_ids:
          description: "Admin only: restrict the scan to this set of customers. Spanning\
            \ more than one customer is how cross-account duplicates (the same item\
            \ submitted under different accounts) are found. Ignored for scoped keys,\
            \ which stay pinned."
          items:
            type: string
          nullable: true
          type: array
          default: null
        limit:
          default: 500
          description: Max items to scan for near-duplicates.
          maximum: 5000.0
          minimum: 1.0
          title: Limit
          type: integer
        threshold:
          default: 0.92
          description: Similarity cutoff 0..1; higher is stricter (1.0 = near-identical).
          maximum: 1.0
          minimum: 0.0
          title: Threshold
          type: number
      title: DuplicatesRequest
    DuplicatesResponse:
      example:
        clusters: 0
        duplicate_clusters:
        - member_customers:
          - member_customers
          - member_customers
          members:
          - 6
          - 6
          size: 1
          tightness: 5.962133916683182
        - member_customers:
          - member_customers
          - member_customers
          members:
          - 6
          - 6
          size: 1
          tightness: 5.962133916683182
        total_duplicates: 5
      properties:
        clusters:
          description: Number of near-duplicate clusters found.
          title: Clusters
          type: integer
        duplicate_clusters:
          description: "The near-duplicate clusters, largest and tightest first."
